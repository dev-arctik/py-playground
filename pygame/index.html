<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading... | Py-Playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css">
    <script>
        // Sim metadata — title, description, canvas size, and config flag
        // size: [width, height] from each original's pygame.display.set_mode()
        const SIMS = {
            'moving-square':       { title: 'Moving Square',         desc: 'Move a red square with arrow keys',                        size: [500, 500] },
            'jumping-square':      { title: 'Jumping Square',        desc: 'Arrow keys to move, jump physics with velocity wrapping',   size: [500, 500] },
            'pendulum':            { title: 'Pendulum',              desc: 'Physics-based pendulum simulation',                        size: [500, 500] },
            'sine-wave':           { title: 'Sine Wave',             desc: 'Animated sine wave visualization',                         size: [500, 500] },
            'sierpinski-triangle': { title: 'Sierpinski Triangle',   desc: 'Chaos game fractal (Pygame version)',                      size: [500, 500] },
            'paint-board':         { title: 'Paint Board',           desc: 'Arrow keys to draw, press C to clear',                     size: [500, 500] },
            'paint-random-screen': { title: 'Paint Random Screen',   desc: 'Screen fills with random colored rectangles',              size: [800, 560] },
            'paint-random-color':  { title: 'Paint Random Color',    desc: 'Click and drag to paint with random colors',               size: [800, 550] },
            'rgb-strips':          { title: 'RGB Strips',            desc: 'Animated RGB color strips',                                size: [675, 600] },
            'first-game':          { title: 'First Game',            desc: 'Side-scrolling shooter',           config: true,            size: [500, 480] },
            'minesweeper':         { title: 'Minesweeper',           desc: 'Classic minesweeper game',         config: true,            size: [400, 440] },
        };

        const sim = new URLSearchParams(location.search).get('sim');
        const meta = SIMS[sim];
        if (meta) {
            document.title = `${meta.title} | Py-Playground`;
        }
    </script>
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
    <style>
        :root {
            --bg: #08080d;
            --surface: #111118;
            --surface-hover: #1a1a24;
            --border: #1e1e2a;
            --border-hover: #2a2a3a;
            --text: #e4e2de;
            --text-muted: #7a7a8c;
            --text-dim: #4a4a5c;
            /* Orange accent for Pygame (teal is for Turtle) */
            --accent: #ff6b35;
            --accent-dim: rgba(255, 107, 53, 0.06);
            --accent-glow: rgba(255, 107, 53, 0.15);
            --error: #ff6b6b;
            --error-bg: rgba(255, 107, 107, 0.08);
            --error-border: rgba(255, 107, 107, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'IBM Plex Mono', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
            background-image: radial-gradient(circle, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 28px 28px;
        }

        /* Film-grain overlay */
        .grain {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 100;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 256px 256px;
        }

        /* Top navigation bar */
        .nav {
            padding: 16px 32px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-brand {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }

        .nav-brand:hover { color: var(--accent); }

        .nav-badge {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.5px;
            padding: 4px 10px;
            border-radius: 100px;
            background: var(--accent-dim);
            color: var(--accent);
        }

        /* Main content area */
        .main {
            max-width: 920px;
            margin: 0 auto;
            padding: 48px 32px 80px;
        }

        /* Sim header */
        .sim-header {
            margin-bottom: 32px;
            opacity: 0;
            transform: translateY(12px);
            animation: fadeUp 0.5s ease forwards;
        }

        .sim-title {
            font-family: 'Instrument Serif', serif;
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 400;
            color: var(--text);
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .sim-desc {
            font-size: 14px;
            color: var(--text-muted);
            font-style: italic;
            max-width: 520px;
        }

        /* Canvas frame — black background for pygame sims */
        .canvas-frame {
            position: relative;
            background: #000000;
            border: 1px solid var(--border-hover);
            border-radius: 12px;
            overflow: hidden;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateY(16px);
            animation: fadeUp 0.5s ease 0.15s forwards;
            transition: box-shadow 0.3s ease;
        }

        .canvas-frame:hover {
            box-shadow: 0 4px 32px rgba(255, 107, 53, 0.06);
        }

        /* Pygame canvas — centered inside the frame */
        .canvas-frame canvas {
            display: block;
            max-width: 100%;
            height: auto;
            outline: none;
        }

        /* Loading overlay — sits on top of the canvas until py:ready fires */
        .loading-state {
            position: absolute;
            inset: 0;
            z-index: 10;
            background: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 60px 20px;
            transition: opacity 0.3s ease;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #2a2a3a;
            border-top-color: #ff6b35;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-text {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 14px;
            color: #7a7a8c;
            letter-spacing: 0.3px;
        }

        .loading-subtext {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            color: #5a5a6c;
            opacity: 0.6;
        }

        /* Error state */
        .error-state {
            display: none;
            padding: 16px 20px;
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            border-radius: 8px;
            margin-top: 20px;
        }

        .error-state code {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            color: var(--error);
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Sim listing (fallback when no ?sim= param) */
        .sim-listing {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 14px;
            margin-top: 24px;
        }

        .sim-card {
            display: block;
            padding: 20px 24px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            text-decoration: none;
            color: var(--text);
            position: relative;
            transition: all 0.3s ease;
        }

        /* Arrow indicator on hover */
        .sim-card::after {
            content: '\2192';
            position: absolute;
            top: 20px;
            right: 24px;
            font-size: 16px;
            color: var(--text-dim);
            transition: all 0.3s;
            opacity: 0;
            transform: translateX(-4px);
        }

        .sim-card:hover {
            border-color: rgba(255, 107, 53, 0.3);
            box-shadow: 0 4px 24px var(--accent-glow), 0 0 0 1px rgba(255, 107, 53, 0.08);
            background: var(--surface-hover);
            transform: translateY(-3px);
        }

        .sim-card:hover::after {
            opacity: 1;
            transform: translateX(0);
            color: var(--accent);
        }

        /* "Coming Soon" card variant */
        .sim-card--soon {
            opacity: 0.5;
            border-style: dashed;
            pointer-events: none;
        }

        .sim-card-title {
            font-family: 'Instrument Serif', serif;
            font-size: 20px;
            margin-bottom: 6px;
        }

        .sim-card-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .sim-card-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 100px;
            margin-top: 8px;
            background: rgba(255, 107, 53, 0.08);
            color: #ff6b35;
        }

        .sim-card-badge--soon {
            background: rgba(122, 122, 140, 0.1);
            color: var(--text-dim);
        }

        /* Footer area */
        .footer {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            opacity: 0;
            animation: fadeUp 0.5s ease 0.3s forwards;
        }

        .back-link {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .back-link:hover { color: var(--accent); }

        .back-link svg {
            width: 16px;
            height: 16px;
            transition: transform 0.2s;
        }

        .back-link:hover svg { transform: translateX(-3px); }

        .source-link {
            font-size: 12px;
            color: var(--text-dim);
            text-decoration: none;
            transition: color 0.2s;
        }

        .source-link:hover { color: var(--text-muted); }

        /* Hide PyScript default UI elements */
        py-script, py-config { display: none; }

        /* Animations */
        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .nav { padding: 12px 16px; }
            .main { padding: 28px 16px 60px; }
            .sim-title { font-size: 1.75rem; }
            .canvas-frame { border-radius: 8px; }
            .sim-listing { grid-template-columns: 1fr; }
            .footer { flex-direction: column; gap: 12px; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <!-- Grain texture overlay -->
    <div class="grain" aria-hidden="true"></div>

    <nav class="nav">
        <a href="../index.html" class="nav-brand">Py-Playground</a>
        <span class="nav-badge">Pygame</span>
    </nav>

    <main class="main">
        <div class="sim-header">
            <h1 id="sim-title" class="sim-title">Loading...</h1>
            <p id="sim-desc" class="sim-desc"></p>
        </div>

        <div id="canvas-frame" class="canvas-frame">
            <!-- Canvas for pygame rendering — tabindex ensures keyboard focus -->
            <canvas id="canvas" tabindex="0" style="image-rendering: pixelated;"></canvas>
            <!-- Loading overlay — hides on py:ready -->
            <div id="loading" class="loading-state">
                <div class="spinner"></div>
                <span class="loading-text">Loading Python runtime...</span>
                <span class="loading-subtext">Downloading Pyodide (~15 MB on first visit)</span>
            </div>
        </div>

        <div id="error" class="error-state"></div>

        <div class="footer">
            <a href="../index.html" class="back-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
                Back to Gallery
            </a>
            <a href="https://github.com/dev-arctik" target="_blank" rel="noopener" class="source-link">View original source</a>
        </div>
    </main>

    <script>
        if (meta) {
            // Populate sim header
            document.getElementById('sim-title').textContent = meta.title;
            document.getElementById('sim-desc').textContent = meta.desc;

            // Set canvas dimensions to match original pygame.display.set_mode()
            const canvas = document.getElementById('canvas');
            if (meta.size) {
                canvas.width = meta.size[0];
                canvas.height = meta.size[1];
            }

            // Inject <script type="py-game"> in the body (after canvas, per PyScript docs)
            const tag = document.createElement('script');
            tag.type = 'py-game';
            tag.src = `${sim}/main.py`;
            if (meta.config) {
                tag.setAttribute('config', `${sim}/pyscript.toml`);
            }
            document.body.appendChild(tag);

            // Hide loading overlay once the game is running
            // py:ready works for type="py" but not for experimental py-game
            function hideLoading() {
                const el = document.getElementById('loading');
                if (el) el.style.display = 'none';
                canvas.focus();
                clearInterval(poll);
            }
            document.addEventListener('py:ready', hideLoading);

            // Fallback: pygame.display.set_caption() changes document.title
            const origTitle = document.title;
            const poll = setInterval(() => {
                if (document.title !== origTitle) hideLoading();
            }, 300);

            // Ultimate fallback: hide after 30s regardless
            setTimeout(() => hideLoading(), 30000);

        } else {
            // No sim selected — show listing of all available simulations
            document.getElementById('sim-title').textContent = 'Pygame Simulations';
            document.getElementById('sim-desc').textContent = 'Choose a simulation to explore';
            document.getElementById('loading').style.display = 'none';

            const frame = document.getElementById('canvas-frame');
            frame.style.background = 'transparent';
            frame.style.border = 'none';
            frame.style.boxShadow = 'none';
            frame.style.minHeight = 'auto';
            frame.style.display = 'block';

            // List of sims that are actually implemented (not "coming soon")
            const implemented = new Set([
                'moving-square', 'jumping-square', 'pendulum', 'sine-wave',
                'sierpinski-triangle', 'paint-board', 'paint-random-screen',
                'paint-random-color', 'rgb-strips',
            ]);

            const listing = document.createElement('div');
            listing.className = 'sim-listing';
            Object.entries(SIMS).forEach(([k, v], i) => {
                const isSoon = !implemented.has(k);
                const a = document.createElement(isSoon ? 'div' : 'a');
                if (!isSoon) a.href = `?sim=${k}`;
                a.className = `sim-card${isSoon ? ' sim-card--soon' : ''}`;
                a.style.setProperty('--i', i);

                const title = document.createElement('div');
                title.className = 'sim-card-title';
                title.textContent = v.title;

                const desc = document.createElement('div');
                desc.className = 'sim-card-desc';
                desc.textContent = v.desc;

                const badge = document.createElement('span');
                badge.className = `sim-card-badge${isSoon ? ' sim-card-badge--soon' : ''}`;
                badge.textContent = isSoon ? 'Coming Soon' : 'Pygame';

                a.appendChild(title);
                a.appendChild(desc);
                a.appendChild(badge);
                listing.appendChild(a);
            });
            frame.appendChild(listing);
        }
    </script>
</body>
</html>
